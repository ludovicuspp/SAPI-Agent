name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke-test (cara pública)
    runs-on: ubuntu-latest
    steps:
      - name: Esperar al pull-deploy (la VM trae los cambios via sapi-pull.timer)
        run: sleep 60

      - name: Health check público
        run: |
          curl -sf https://marcas.solutechve.net/api/health
          curl -sf -o /dev/null -w "dashboard=%{http_code}\n" https://marcas.solutechve.net/
