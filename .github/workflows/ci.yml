name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests (backend + Hermes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pytest (backend)
        run: |
          pytest tests/test_api.py tests/test_auth.py tests/test_db.py -v --tb=short
      - name: Pytest (parsers + processor + matcher)
        run: |
          pytest tests/test_matchers.py tests/test_matcher_calidad.py tests/test_parsers.py tests/test_patterns.py tests/test_processor.py tests/test_schemas.py -v --tb=short
      - name: Pytest (alucinaciones)
        run: pytest tests/test_alucinaciones.py -v --tb=long
      - name: Pytest (orquestador)
        run: pytest tests/test_orquestador.py -v --tb=long
      - name: Pytest (e2e pipeline)
        run: pytest tests/test_pipeline_e2e.py -v --tb=long
      - name: Pytest (metrics + notifier + versioning + upload)
        run: pytest tests/test_metrics.py tests/test_notifier_events.py tests/test_versioning.py tests/test_upload_nodup.py -v --tb=long

      - name: Pytest (Hermes skill)
        run: pytest hermes/skills/sapi-monitor/tests/ -v --tb=short

  dashboard:
    name: Dashboard tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Type-check + Build
        working-directory: dashboard
        run: npm run build

      - name: Vitest
        working-directory: dashboard
        run: npm test

      - name: Upload dist artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  gate:
    name: CI verde
    needs: [backend, dashboard]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed (backend + dashboard + build)"
